<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诗篓 · 用户管理</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .admin-container { max-width: 640px; margin: 0 auto; }
        .user-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        .user-table th,
        .user-table td {
            padding: 0.5rem 0.8rem;
            border-bottom: 1px solid #e0dcd4;
            text-align: left;
        }
        .user-table th {
            font-weight: 500;
            color: #7a7a6a;
            font-size: 0.85rem;
        }
        .user-table .actions {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .user-table .actions button {
            padding: 0.15rem 0.6rem;
            border: 1px solid #d6d0c8;
            border-radius: 3px;
            background: #ede8e0;
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
        }
        .user-table .actions button.danger { color: #a07060; border-color: #d4c0b8; }
        .user-table .actions button.danger:hover { background: #d4c0b8; }
        .user-table .actions button.reset { color: #4a6a7a; border-color: #b8c8d4; }
        .user-table .actions button.reset:hover { background: #d4e0e8; }
        .user-table .actions button:hover { background: #e0dcd4; }

        .badge-admin {
            background: #6a7a6a;
            color: #f5f2ed;
            padding: 0.05rem 0.5rem;
            border-radius: 12px;
            font-size: 0.7rem;
        }
        .badge-user {
            background: #ede8e0;
            color: #7a7a6a;
            padding: 0.05rem 0.5rem;
            border-radius: 12px;
            font-size: 0.7rem;
        }

        .add-form {
            background: #f5f2ed;
            padding: 1rem 1.2rem;
            border-radius: 4px;
            margin: 1rem 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            align-items: flex-end;
        }
        .add-form .field {
            flex: 1;
            min-width: 120px;
        }
        .add-form .field label {
            display: block;
            font-size: 0.8rem;
            color: #7a7a6a;
            margin-bottom: 0.1rem;
        }
        .add-form .field input,
        .add-form .field select {
            width: 100%;
            padding: 0.4rem 0.6rem;
            border: 1px solid #d6d0c8;
            border-radius: 3px;
            font-size: 0.9rem;
            font-family: inherit;
            background: white;
        }
        .add-form button {
            padding: 0.4rem 1.2rem;
            border: 1px solid #6a7a6a;
            border-radius: 3px;
            background: #6a7a6a;
            color: #f5f2ed;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .add-form button:hover { background: #5a6a5a; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #fcfbf9;
            padding: 2rem;
            border-radius: 6px;
            max-width: 400px;
            width: 90%;
            border: 1px solid #d6d0c8;
        }
        .modal-box h3 {
            font-weight: 400;
            font-size: 1.2rem;
            color: #4a4a3a;
            margin-bottom: 1.2rem;
            text-align: center;
            letter-spacing: 1px;
        }
        .modal-box input {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid #d6d0c8;
            border-radius: 4px;
            font-size: 0.95rem;
            background: white;
            margin-bottom: 0.8rem;
            box-sizing: border-box;
            font-family: inherit;
        }
        .modal-box input:focus {
            outline: none;
            border-color: #a8a898;
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
            margin-top: 0.5rem;
        }
        .modal-box .modal-actions button {
            padding: 0.4rem 1.2rem;
            border: 1px solid #d6d0c8;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            background: #ede8e0;
            color: #4a4a3a;
        }
        .modal-box .modal-actions button:hover { background: #e0dcd4; }
        .modal-box .modal-actions button.primary {
            background: #6a7a6a;
            color: #f5f2ed;
            border-color: #6a7a6a;
        }
        .modal-box .modal-actions button.primary:hover { background: #5a6a5a; }
        .modal-box .modal-error {
            color: #a07060;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 0.6rem;
            display: none;
        }
        .modal-box .modal-success {
            color: #4a7a4a;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 0.6rem;
            display: none;
        }
        .display-name { color: #4a4a3a; font-weight: 400; }
        .display-name .small { font-size: 0.75rem; color: #b0a898; font-weight: 300; }
    </style>
</head>
<body>
    <div class="container admin-container">
        <header>
            <h2>📜诗篓-用户管理</h2>
            <nav>
                <a href="/">首页</a>
                <a href="/check">格律</a>
                <a href="/create">录诗</a>
                <a href="#" onclick="showChangePwd()" style="color:#6a7a6a;font-size:0.85rem;">改密码</a>
                <a href="#" onclick="logout()" style="color:#b0a898;font-size:0.85rem;">退出</a>
            </nav>
        </header>

        <div class="add-form">
            <div class="field">
                <label>显示名称</label>
                <input type="text" id="newDisplayName" placeholder="如：张三">
            </div>
            <div class="field">
                <label>账号（英文）</label>
                <input type="text" id="newUsername" placeholder="如：zhangsan">
            </div>
            <div class="field">
                <label>密码</label>
                <input type="text" id="newPassword" placeholder="至少4位">
            </div>
            <div class="field" style="min-width:80px;">
                <label>角色</label>
                <select id="newAdmin">
                    <option value="0">普通用户</option>
                    <option value="1">管理员</option>
                </select>
            </div>
            <button id="addBtn">添加</button>
        </div>

        <table class="user-table">
            <thead>
                <tr>
                    <th>显示名称</th>
                    <th>账号</th>
                    <th>角色</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="userList"></tbody>
        </table>

        <footer>诗篓-私人诗词工作台</footer>
    </div>

    <!-- 修改密码弹窗 -->
    <div class="modal-overlay" id="changePwdModal">
        <div class="modal-box">
            <h3>修改密码</h3>
            <div id="modalError" class="modal-error"></div>
            <div id="modalSuccess" class="modal-success"></div>
            <input type="password" id="oldPwd" placeholder="当前密码">
            <input type="password" id="newPwd" placeholder="新密码（至少4位）">
            <input type="password" id="confirmPwd" placeholder="确认新密码">
            <div class="modal-actions">
                <button onclick="closeChangePwd()">取消</button>
                <button class="primary" id="changePwdBtn">确认修改</button>
            </div>
        </div>
    </div>

    <!-- 重置密码弹窗 -->
    <div class="modal-overlay" id="resetPwdModal">
        <div class="modal-box">
            <h3 id="resetTitle">重置用户密码</h3>
            <div id="resetError" class="modal-error"></div>
            <div id="resetSuccess" class="modal-success"></div>
            <input type="password" id="resetNewPwd" placeholder="新密码（至少4位）">
            <input type="password" id="resetConfirmPwd" placeholder="确认新密码">
            <div class="modal-actions">
                <button onclick="closeResetPwd()">取消</button>
                <button class="primary" id="resetPwdBtn">确认重置</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        var toast = document.getElementById('toast');
        var toastTimer = null;

        function showToast(msg, type) {
            toast.textContent = msg;
            toast.className = 'toast' + (type ? ' ' + type : '');
            void toast.offsetWidth;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() {
                toast.classList.remove('show');
            }, 3000);
        }

        function loadUsers() {
            fetch('/api/admin/users')
                .then(function(r) { return r.json(); })
                .then(function(res) {
                    if (res.code !== 0) {
                        showToast('加载失败', 'error');
                        return;
                    }
                    renderUsers(res.data);
                })
                .catch(function() {
                    showToast('网络错误', 'error');
                });
        }

        function renderUsers(users) {
            var tbody = document.getElementById('userList');
            var html = '';
            users.forEach(function(u) {
                var role = u.admin ? '<span class="badge-admin">管理员</span>' : '<span class="badge-user">普通用户</span>';
                var displayName = u.display_name || u.username;
                var actions = '';
                if (u.username !== 'admin') {
                    actions += '<button class="reset" onclick="showResetPwd(\'' + u.username + '\')">重置密码</button>';
                    actions += '<button class="danger" onclick="deleteUser(\'' + u.username + '\')">删除</button>';
                }
                html += '<tr>' +
                    '<td><span class="display-name">' + displayName + '</span></td>' +
                    '<td><span class="small">' + u.username + '</span></td>' +
                    '<td>' + role + '</td>' +
                    '<td class="actions">' + actions + '</td>' +
                    '</tr>';
            });
            tbody.innerHTML = html;
        }

        function deleteUser(username) {
            if (!confirm('确认删除用户 "' + username + '"？')) return;
            fetch('/api/admin/users/' + username, { method: 'DELETE' })
                .then(function(r) { return r.json(); })
                .then(function(res) {
                    if (res.code === 0) {
                        showToast('删除成功', 'success');
                        loadUsers();
                    } else {
                        showToast(res.msg || '删除失败', 'error');
                    }
                })
                .catch(function() {
                    showToast('网络错误', 'error');
                });
        }

        document.getElementById('addBtn').addEventListener('click', function() {
            var displayName = document.getElementById('newDisplayName').value.trim();
            var username = document.getElementById('newUsername').value.trim();
            var password = document.getElementById('newPassword').value.trim();
            var admin = document.getElementById('newAdmin').value === '1';

            if (!displayName || !username || !password) {
                showToast('请完整填写所有字段', 'error');
                return;
            }
            if (username.length < 2) {
                showToast('账号至少2位', 'error');
                return;
            }
            if (password.length < 4) {
                showToast('密码至少4位', 'error');
                return;
            }

            this.textContent = '添加中…';
            this.disabled = true;

            fetch('/api/admin/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    display_name: displayName,
                    username: username,
                    password: password,
                    admin: admin
                })
            })
            .then(function(r) { return r.json(); })
            .then(function(res) {
                document.getElementById('addBtn').textContent = '添加';
                document.getElementById('addBtn').disabled = false;
                if (res.code === 0) {
                    showToast('添加成功', 'success');
                    document.getElementById('newDisplayName').value = '';
                    document.getElementById('newUsername').value = '';
                    document.getElementById('newPassword').value = '';
                    loadUsers();
                } else {
                    showToast(res.msg || '添加失败', 'error');
                }
            })
            .catch(function() {
                document.getElementById('addBtn').textContent = '添加';
                document.getElementById('addBtn').disabled = false;
                showToast('网络错误', 'error');
            });
        });

        // ===== 修改密码 =====
        var changeModal = document.getElementById('changePwdModal');
        var changeError = document.getElementById('modalError');
        var changeSuccess = document.getElementById('modalSuccess');

        function showChangePwd() {
            changeModal.classList.add('show');
            document.getElementById('oldPwd').value = '';
            document.getElementById('newPwd').value = '';
            document.getElementById('confirmPwd').value = '';
            changeError.style.display = 'none';
            changeSuccess.style.display = 'none';
        }

        function closeChangePwd() {
            changeModal.classList.remove('show');
        }

        document.getElementById('changePwdBtn').addEventListener('click', function() {
            var oldPwd = document.getElementById('oldPwd').value.trim();
            var newPwd = document.getElementById('newPwd').value.trim();
            var confirmPwd = document.getElementById('confirmPwd').value.trim();

            changeError.style.display = 'none';
            changeSuccess.style.display = 'none';

            if (!oldPwd || !newPwd || !confirmPwd) {
                changeError.textContent = '请完整填写所有字段';
                changeError.style.display = 'block';
                return;
            }
            if (newPwd.length < 4) {
                changeError.textContent = '新密码至少4位';
                changeError.style.display = 'block';
                return;
            }
            if (newPwd !== confirmPwd) {
                changeError.textContent = '两次输入的密码不一致';
                changeError.style.display = 'block';
                return;
            }

            this.textContent = '修改中…';
            this.disabled = true;

            fetch('/api/admin/change_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ old_password: oldPwd, new_password: newPwd })
            })
            .then(function(r) { return r.json(); })
            .then(function(res) {
                document.getElementById('changePwdBtn').textContent = '确认修改';
                document.getElementById('changePwdBtn').disabled = false;

                if (res.code === 0) {
                    changeSuccess.textContent = '密码修改成功，请重新登录';
                    changeSuccess.style.display = 'block';
                    setTimeout(function() {
                        location.href = '/login';
                    }, 1500);
                } else {
                    changeError.textContent = res.msg || '修改失败';
                    changeError.style.display = 'block';
                }
            })
            .catch(function() {
                document.getElementById('changePwdBtn').textContent = '确认修改';
                document.getElementById('changePwdBtn').disabled = false;
                changeError.textContent = '网络错误，请重试';
                changeError.style.display = 'block';
            });
        });

        changeModal.addEventListener('click', function(e) {
            if (e.target === changeModal) closeChangePwd();
        });

        // ===== 重置密码 =====
        var resetModal = document.getElementById('resetPwdModal');
        var resetError = document.getElementById('resetError');
        var resetSuccess = document.getElementById('resetSuccess');
        var resetTargetUser = '';

        function showResetPwd(username) {
            resetTargetUser = username;
            document.getElementById('resetTitle').textContent = '重置用户「' + username + '」的密码';
            resetModal.classList.add('show');
            document.getElementById('resetNewPwd').value = '';
            document.getElementById('resetConfirmPwd').value = '';
            resetError.style.display = 'none';
            resetSuccess.style.display = 'none';
        }

        function closeResetPwd() {
            resetModal.classList.remove('show');
            resetTargetUser = '';
        }

        document.getElementById('resetPwdBtn').addEventListener('click', function() {
            var newPwd = document.getElementById('resetNewPwd').value.trim();
            var confirmPwd = document.getElementById('resetConfirmPwd').value.trim();

            resetError.style.display = 'none';
            resetSuccess.style.display = 'none';

            if (!newPwd || !confirmPwd) {
                resetError.textContent = '请完整填写所有字段';
                resetError.style.display = 'block';
                return;
            }
            if (newPwd.length < 4) {
                resetError.textContent = '密码至少4位';
                resetError.style.display = 'block';
                return;
            }
            if (newPwd !== confirmPwd) {
                resetError.textContent = '两次输入的密码不一致';
                resetError.style.display = 'block';
                return;
            }

            this.textContent = '重置中…';
            this.disabled = true;

            fetch('/api/admin/users/' + resetTargetUser + '/reset_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: newPwd })
            })
            .then(function(r) { return r.json(); })
            .then(function(res) {
                document.getElementById('resetPwdBtn').textContent = '确认重置';
                document.getElementById('resetPwdBtn').disabled = false;

                if (res.code === 0) {
                    resetSuccess.textContent = '密码已重置为：' + newPwd;
                    resetSuccess.style.display = 'block';
                    setTimeout(function() {
                        closeResetPwd();
                        loadUsers();
                    }, 1500);
                } else {
                    resetError.textContent = res.msg || '重置失败';
                    resetError.style.display = 'block';
                }
            })
            .catch(function() {
                document.getElementById('resetPwdBtn').textContent = '确认重置';
                document.getElementById('resetPwdBtn').disabled = false;
                resetError.textContent = '网络错误，请重试';
                resetError.style.display = 'block';
            });
        });

        resetModal.addEventListener('click', function(e) {
            if (e.target === resetModal) closeResetPwd();
        });

        function logout() {
            if (!confirm('确认退出？')) return;
            fetch('/api/logout', { method: 'POST' })
                .then(function(r) { return r.json(); })
                .then(function(res) {
                    if (res.code === 0) location.href = '/login';
                });
        }

        loadUsers();
    </script>
</body>
</html>
